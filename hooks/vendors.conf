# Model vendor switch — which vendors' models the harness may route work to.
#
# One line per vendor: <vendor>=enabled|disabled. Anything else fails closed to disabled.
# To toggle a vendor on ONE machine without a PR, put the same line in
# ~/.claude/private/vendors.conf; it wins per vendor over this file.
# Check the resolved state with: bash ~/.claude/hooks/vendors.sh
#
# Routing preference order and each vendor's model column live in hooks/model-routing-table.sh.
# anthropic cannot be disabled: the orchestrating session is Claude.

anthropic=enabled
# ChatGPT subscription paused 2026-09-28 (cch-6e5). Flip to enabled when it resumes.
openai=disabled
